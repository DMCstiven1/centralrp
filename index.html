<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Central RP</title>

  <link rel="icon" type="image/png" href="https://i.imgur.com/rg130IN.png">
  
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Outfit:wght@800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-dark: #0b090f;
    --accent: #feb8ff;
    --accent-glow: rgba(254, 184, 255, 0.4);
    --text-main: #ffffff;
    --text-muted: #b8b2bc;
    --success: #4ade80;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background-color: var(--bg-dark);
    color: var(--text-main);
    font-family: 'Inter', sans-serif;
    overflow-x: hidden;
    height: 100vh;
  }

  /* Fondo atmosférico garantizado con respaldo de alta calidad y gradiente neón */
  .hero {
    position: relative;
    width: 100%;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 40px 20px;
    background: linear-gradient(rgba(11, 9, 15, 0.85), rgba(11, 9, 15, 0.92), rgba(11, 9, 15, 0.98)),
                url('https://i.imgur.com/nB62BWW.png') no-repeat center center/cover;
  }

  .hero::after {
    content: "";
    position: absolute;
    inset: 0;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    z-index: 1;
    pointer-events: none;
  }

  .hero::before {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 30%, rgba(254, 184, 255, 0.08) 0%, transparent 60%);
    z-index: 1;
    pointer-events: none;
  }

  .hero-content {
    max-width: 850px;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* BOTONES SUPERIORES / IZQUIERDA */
  .top-buttons-container {
    display: flex;
    gap: 16px;
    margin-bottom: 24px;
    z-index: 10;
  }

  .btn-action {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: rgba(254, 184, 255, 0.05);
    color: var(--accent);
    border: 1px solid rgba(254, 184, 255, 0.3);
    cursor: pointer;
    transition: all 0.25s ease;
    text-decoration: none;
    backdrop-filter: blur(8px);
  }

  .btn-action:hover {
    background: var(--accent);
    color: #0b090f;
    border-color: var(--accent);
    transform: scale(1.1);
    box-shadow: 0 0 25px var(--accent-glow);
  }

  .btn-action svg {
    width: 22px;
    height: 22px;
    fill: currentColor;
    flex-shrink: 0;
  }

  /* Badge superior */
  .badge-top {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    background: rgba(254, 184, 255, 0.07);
    border: 1px solid rgba(254, 184, 255, 0.25);
    padding: 10px 26px;
    border-radius: 50px;
    font-size: 1rem;
    font-weight: 600;
    color: var(--accent);
    margin-bottom: 28px;
    letter-spacing: 0.02em;
    backdrop-filter: blur(12px);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
  }

  .badge-top .sparkle {
    color: var(--accent);
    display: inline-flex;
    align-items: center;
  }

  .badge-top .dot {
    width: 9px; height: 9px; background: var(--success);
    border-radius: 50%; box-shadow: 0 0 12px var(--success);
  }

  /* TÍTULO PRINCIPAL */
  h1 {
    font-family: 'Outfit', sans-serif;
    font-weight: 900;
    font-size: clamp(3.5rem, 8.5vw, 6.5rem);
    text-transform: uppercase;
    line-height: 1.05;
    letter-spacing: -0.02em;
    margin-bottom: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .title-line-1 {
    color: #ffffff;
    text-shadow: 0 2px 20px rgba(0, 0, 0, 0.5);
  }

  .title-line-2 {
    color: var(--accent);
    text-shadow: 0 0 35px var(--accent-glow);
  }

  .hero p {
    font-size: 1.1rem;
    color: var(--text-muted);
    margin-bottom: 25px;
    max-width: 600px;
    margin-left: auto;
    margin-right: auto;
  }

  /* BOTÓN "Comenzar Aventura" (SOLO SE MUESTRA EN PC) */
  .btn-adventure {
    display: inline-flex; 
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: var(--accent);
    color: #0b090f;
    font-family: 'Outfit', sans-serif;
    font-weight: 800;
    font-size: 1.15rem;
    padding: 18px 40px;
    border-radius: 14px;
    border: none;
    cursor: pointer;
    text-decoration: none;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    box-shadow: 0 0 30px var(--accent-glow);
    margin-bottom: 45px;
  }

  .btn-adventure:hover {
    transform: translateY(-2px);
    background: #ffffff;
    box-shadow: 0 0 45px rgba(254, 184, 255, 0.7);
  }

  .btn-adventure svg:first-child,
  .btn-adventure svg:last-child {
    width: 20px;
    height: 20px;
    fill: currentColor;
    flex-shrink: 0;
  }

  /* CUADRO COMPACTO MÁS PEQUEÑO "Solo disponible en PC" (SOLO SE MUESTRA EN TELÉFONOS) */
  .mobile-card {
    display: none; 
    background: rgba(254, 184, 255, 0.04);
    border: 1px solid rgba(254, 184, 255, 0.25);
    padding: 10px 14px;
    border-radius: 10px;
    max-width: 240px;
    width: 100%;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
    align-items: center;
    gap: 10px;
    margin-bottom: 20px;
    text-align: left;
  }

  .mobile-icon-box {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: rgba(254, 184, 255, 0.1);
    border: 1px solid rgba(254, 184, 255, 0.3);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--accent);
    box-shadow: 0 0 10px var(--accent-glow);
    flex-shrink: 0;
  }

  .mobile-icon-box svg {
    width: 16px;
    height: 16px;
    fill: currentColor;
  }

  .mobile-text-group {
    display: flex;
    flex-direction: column;
    gap: 1px;
  }

  .mobile-title {
    font-family: 'Outfit', sans-serif;
    font-weight: 800;
    font-size: 0.8rem;
    color: var(--text-main);
    text-transform: uppercase;
    letter-spacing: 0.02em;
  }

  .mobile-desc {
    font-family: 'Inter', sans-serif;
    font-size: 0.7rem;
    color: var(--text-muted);
    line-height: 1.2;
  }

  /* ESTADÍSTICAS ABAJO */
  .stats-container {
    display: flex;
    justify-content: center;
    gap: 60px;
    width: 100%;
    margin-top: 10px;
  }

  .stat-item {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .stat-value {
    font-family: 'Outfit', sans-serif;
    font-weight: 900;
    font-size: 2.8rem;
    line-height: 1.1;
    margin-bottom: 4px;
  }

  .stat-value.online {
    color: #4ade80;
    text-shadow: 0 0 15px rgba(74, 222, 128, 0.4);
  }

  .stat-value.miembros {
    color: #60a5fa;
    text-shadow: 0 0 15px rgba(96, 165, 250, 0.4);
  }

  .stat-value.activo {
    color: var(--accent);
    text-shadow: 0 0 20px var(--accent-glow);
  }

  .stat-label {
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: 0.95rem;
    color: #a0a0ab;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  /* REGLAS PARA TELÉFONOS (Eleva la información hacia arriba para que no se salga ni quede abajo) */
  @media (max-width: 900px) {
    .btn-adventure {
      display: none !important; 
    }
    .mobile-card {
      display: flex !important; 
    }
    .hero {
      height: 100vh;
      justify-content: flex-start;
      padding: 25px 15px;
      overflow-y: auto;
    }
    .hero-content {
      margin-top: auto;
      margin-bottom: auto;
      padding: 5px 0;
    }
    .top-buttons-container {
      margin-bottom: 14px;
    }
    .badge-top {
      margin-bottom: 14px;
      padding: 7px 18px;
      font-size: 0.85rem;
    }
    h1 {
      font-size: clamp(2.5rem, 11vw, 4rem);
      margin-bottom: 10px;
    }
    .hero p {
      font-size: 0.9rem;
      margin-bottom: 14px;
    }
    .stats-container {
      gap: 25px;
      margin-top: 5px;
    }
    .stat-value {
      font-size: 2rem;
    }
    .stat-label {
      font-size: 0.75rem;
    }
  }

  @media (min-width: 901px) {
    .btn-adventure {
      display: inline-flex !important; 
    }
    .mobile-card {
      display: none !important; 
    }
  }
</style>
</head>
